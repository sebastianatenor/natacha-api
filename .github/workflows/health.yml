name: Health Checks
on:
  pull_request:
    branches: [ main ]
jobs:
  health:
    runs-on: ubuntu-latest
    env:
      # Usa repo variable si existe; si no, cae al secreto
      BASE: ${{ vars.NATACHA_BASE_URL != '' && vars.NATACHA_BASE_URL || secrets.NATACHA_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
      - name: Debug BASE
        run: |
          echo "BASE=$BASE"
          if curl -sf "$BASE/health"; then
            echo "✅ Health: OK"
          else
            echo "⚠️  Health endpoint unreachable or invalid. Continuing (non-blocking)."
          fi
      - name: Run health-all
        run: make health-all
